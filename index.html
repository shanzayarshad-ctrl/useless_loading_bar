<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dont close pls</title>
<style>
  body {
    background: repeating-radial-gradient(circle at 50% 50%, black, olive 15%, gray 30%, crimson 45%, darkgoldenrod 60%);
    background-size: 200% 200%;
    animation: glitchBg 0.15s infinite linear;
    font-family: "Comic Sans MS", Papyrus, sans-serif;
    margin: 0px;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  @keyframes glitchBg {
    0% {
      background-position: 0% 0%;
      filter: contrast(300%) invert(0%);
    }
    50% {
      background-position: 50% 100%;
      filter: contrast(200%) invert(80%);
    }
    100% {
      background-position: 100% 0%;
      filter: contrast(300%) invert(0%);
    }
  }

  .annoying-btn {
    background-color: crimson;
    color: gold;
    font-size: 28px;
    font-weight: 900;
    padding: 25px 40px;
    border: 10px double gray;
    outline: 8px dashed black;
    cursor: pointer;
    position: absolute;
    text-transform: uppercase;
    text-shadow: 3px 3px 0px black;
    box-shadow: 10px 10px 0px olive, -10px -10px 0px crimson;
    animation: btnDistort 0.1s infinite alternate;
  }

  @keyframes btnDistort {
    0% {
      transform: skew(0deg, 0deg) scale(1);
    }
    100% {
      transform: skew(10deg, -5deg) scale(1.05);
    }
  }

  .modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: darkgoldenrod;
    border: 15px dotted crimson;
    outline: 10px solid black;
    padding: 30px;
    box-shadow: 0 0 100px crimson, inset 0 0 30px gray;
    z-index: 9999;
    width: 80%;
    max-width: 400px;
    text-align: center;
  }

  .modal h2 {
    color: black;
    font-size: 32px;
    text-shadow: 2px 2px crimson;
    margin-bottom: 10px;
  }

  .modal p {
    color: black;
    font-size: 22px;
    font-weight: bold;
    margin: 0px;
  }
</style>
</head>
<body>

  <!-- WHY WONT THIS STUPID BUTTON WORK AAAAA -->
  <button class="annoying-btn" id="painButton" disabled>CLICK HERE TO LOAD</button>

  <div class="modal" id="popup">
    <h2>CONGRATULATIONS 🎉</h2>
    <p>You wasted <span id="time">14</span> seconds on this broken button lol</p>
  </div>

  <script>
    // dont touch this code it works somehow
    let myButton = document.getElementById("painButton");
    let popupBox = document.getElementById("popup");
    let secondsElapsed = 0;

    function moveButton() {
      let randomX = Math.random() * 70 + 15;
      let randomY = Math.random() * 70 + 15;
      myButton.style.top = randomX + "%";
      myButton.style.left = randomY + "%";
    }

    myButton.onclick = function(e) {
      e.preventDefault();
      moveButton();
    };
    
    myButton.onmouseover = function(e) {
      e.preventDefault();
      moveButton();
    };

    myButton.onmousemove = function(e) {
      e.preventDefault();
      moveButton();
    };

    let timerThing = setInterval(function() {
      secondsElapsed = secondsElapsed + 1;
      if (secondsElapsed >= 14) {
        popupBox.style.display = "block";
        clearInterval(timerThing);
      }
    }, 1000);
  </script>

</body>
</html>
